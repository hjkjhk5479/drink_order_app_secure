<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飲料訂單管理</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <div class="topnav">
      <h1>📊 飲料訂單管理</h1>

      <button id="logoutBtn" class="secondary" style="width:auto;">
        登出
      </button>
    </div>

    <div class="card">
      <h2>訂單總覽</h2>

      <div id="overview">
        載入中...
      </div>
    </div>

    <div class="card">
      <h2>店家下單整理</h2>

      <div id="summary" class="summary-box">
        載入中...
      </div>

      <br>

      <button id="copyBtn" class="success">
        複製店家訂單
      </button>
    </div>

    <div class="card">
      <h2>所有訂單</h2>

      <div style="
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:20px;
  ">
        <button id="refreshBtn" style="width:100%;">
          重新整理
        </button>

        <button id="deleteAllBtn" class="danger" style="width:100%;">
          刪除全部訂單
        </button>
      </div>


      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>姓名</th>
              <th>店家</th>
              <th>飲料</th>
              <th>甜度</th>
              <th>冰塊</th>
              <th>加料</th>
              <th>數量</th>
              <th>金額</th>
              <th>備註</th>
            </tr>
          </thead>

          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>🏪 店家管理</h2>

      <div class="grid">

        <div>
          <label for="newStoreName">店家名稱</label>
          <input id="newStoreName" type="text" placeholder="例如：麻古茶坊">
        </div>

        <div style="display:flex; align-items:end;">
          <button id="addStoreBtn">
            新增店家
          </button>
        </div>

      </div>

      <div id="storeMessage" class="message"></div>

      <br>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>店家</th>
              <th>狀態</th>
              <th style="width:220px;">操作</th>
            </tr>
          </thead>

          <tbody id="storeTable"></tbody>
        </table>
      </div>
    </div>


    <div class="card">
      <h2>🧋 飲料品項管理</h2>

      <div class="grid">

        <div>
          <label for="manageStore">
            選擇店家
          </label>

          <select id="manageStore"></select>
        </div>

        <div>
          <label for="productName">
            飲料名稱
          </label>

          <input id="productName" type="text" placeholder="例如：熟成紅茶">
        </div>

        <div>
          <label for="productPriceM">
            M 價格
          </label>

          <input id="productPriceM" type="number" min="0" placeholder="例如：35（沒有可留空）">
        </div>

        <div>
          <label for="productPriceL">
            L 價格
          </label>

          <input id="productPriceL" type="number" min="0" placeholder="例如：45（沒有可留空）">
        </div>

        <div style="display:flex; align-items:end;">
          <button id="addProductBtn">
            新增飲料
          </button>
        </div>

      </div>

      <div id="productMessage" class="message"></div>

      <br>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>飲料名稱</th>
              <th>M 價格</th>
              <th>L 價格</th>
              <th>狀態</th>
              <th style="width:220px;">操作</th>
            </tr>
          </thead>

          <tbody id="productTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>

</html>
